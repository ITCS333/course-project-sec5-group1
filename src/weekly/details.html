<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Details</title>
  <link rel="stylesheet" href="..\common\styles.css" />
  <script src="details.js" defer></script>
</head>
<body>

  <header>
    <h1 id="week-title">Loading...</h1>
    <nav>
      <a href="list.html">Back to Weekly Breakdown</a>
    </nav>
  </header>

  <main>

    <!-- Section 1 — Weekly Information -->
    <section id="week-information">
      <p id="week-start-date"></p>
      <p id="week-description"></p>
      <h2>Resources &amp; Links</h2>
      <ul id="week-links-list">
        <!-- <li><a href="...">...</a></li> items injected by details.js -->
      </ul>
    </section>

    <!-- Section 2 — Discussion Forum -->
    <section id="discussion-forum">
      <h2>Discussion</h2>

      <div id="comment-list">
        <!-- Comment <article>s injected by details.js -->
      </div>

      <form id="comment-form" action="#">
        <fieldset>
          <legend>Leave a Comment</legend>

          <label for="new-comment">Your comment:</label>
          <textarea
            id="new-comment"
            name="new-comment"
            rows="4"
            placeholder="Share your thoughts about this week..."
            required></textarea>

          <button type="submit">Post Comment</button>
        </fieldset>
      </form>
    </section>

  </main>

</body>
</html>
